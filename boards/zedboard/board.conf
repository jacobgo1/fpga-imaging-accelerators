# ZedBoard (Zynq-7020, xc7z020clg484-1) with the OPU system's PetaLinux, as the lab's
# ZedBoards run it. Sourced by scripts/common.sh.
PART=xc7z020clg484-1
CLOCK_NS=12.8
FLOW=opu           # scripts/opu.sh: the kernel in opu-system's ZedBoard design
OPU_BOARD_SCRIPT=zedboard_project.tcl    # opu-system's vivado/tcl-scripts/: the PS for this board
MEMORY_BASE=0x10000000                   # the reserved memory (opu-system devicetrees/zed)
